name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run shared module test suite (crypto + vault core)
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-jvm-test-report
          path: shared/build/reports/tests/jvmTest

# NOTE: this only runs the shared module's jvm() target, per
# docs/ARCHITECTURE.md — androidTarget() (and eventually the iOS targets)
# are added once the androidApp module exists (Phase 1). At that point,
# add an `android-actions/setup-android` step and extend the test command
# to also run the Android instrumented tests for the platform-specific
# Keystore/BiometricPrompt layer described in docs/TESTING.md.
