kotlin.mpp.stability.nowarn=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g

# Required for any project using AndroidX (Compose, Fragment, biometric,
# etc. — everything androidApp depends on). Omitting this is what made
# the very first real Android build fail: AGP's AndroidXDependencyCheck
# rejects a classpath full of androidx.* artifacts when this isn't set,
# since it defaults to assuming the pre-AndroidX support library world.
android.useAndroidX=true
android.nonTransitiveRClass=true
